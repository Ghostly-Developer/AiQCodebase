name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: askcode
          POSTGRES_PASSWORD: askcode
          POSTGRES_DB: askcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askcode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://askcode:askcode@localhost:5432/askcode
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,pgvector]"
      # unit + end-to-end tests (hash embedder and fake LLM: no downloads, no API keys)
      # plus the pgvector integration test against the service container
      - run: pytest -q

  eval-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      # every evidence snippet in the eval set must still resolve at the pinned commit
      - run: askcode eval check evals/dapper.json
